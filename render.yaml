services:
  - type: web
    name: sd-agent-backend
    runtime: node
    buildCommand: npm install
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SESSION_HOURS
        value: 24
      - key: REQUEST_MINUTES
        value: 10
    disk:
      name: sd-agent-data
      mountPath: /opt/render/project/src/server
      sizeGB: 1
